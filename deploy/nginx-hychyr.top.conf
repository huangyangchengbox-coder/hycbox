server {
    listen 80;
    server_name hychyr.top www.hychyr.top api.hychyr.top;
    client_max_body_size 100m;

    # 体验版 API（独立库 hycbox_trial，进程 8081）
    location /api-trial/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /uploads-trial/ {
        alias /opt/hycbox-trial/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        autoindex off;
    }

    location /web-v2/ {
        alias /opt/hycbox-web-v2/;
        index index.html;
        try_files $uri $uri/ @web_v2_spa;
    }
    location @web_v2_spa {
        rewrite ^ /web-v2/index.html last;
    }

    location /web/ {
        alias /opt/hycbox-web/;
        index index.html;
        try_files $uri $uri/ @web_spa;
    }
    location @web_spa {
        rewrite ^ /web/index.html last;
    }

    # 体验 Web（同证书主域名，避免 trial 子域无证书）
    location /web-trial/ {
        alias /opt/hycbox-web-trial/;
        index index.html;
        try_files $uri $uri/ @web_trial_spa;
    }
    location @web_trial_spa {
        rewrite ^ /web-trial/index.html last;
    }

    # 纠正误写 /web/-trial → /web-trial
    location ~ ^/web/-trial(/.*)?$ {
        return 302 /web-trial$1;
    }

    location = / {
        return 302 /web/home;
    }

    location /uploads/ {
        alias /opt/hycbox/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        autoindex off;
    }

    # Gitea 仅允许 HTTPS（Cookie Secure；HTTP 访问会导致登录令牌失效）
    location /git/ {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name hychyr.top www.hychyr.top api.hychyr.top;

    ssl_certificate     /etc/nginx/ssl/hychyr.top/hychyr.top.pem;
    ssl_certificate_key /etc/nginx/ssl/hychyr.top/hychyr.top.key;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 100m;

    location /api-trial/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /uploads-trial/ {
        alias /opt/hycbox-trial/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        autoindex off;
    }

    location /web-v2/ {
        alias /opt/hycbox-web-v2/;
        index index.html;
        try_files $uri $uri/ @web_v2_spa_ssl;
    }
    location @web_v2_spa_ssl {
        rewrite ^ /web-v2/index.html last;
    }

    location /web/ {
        alias /opt/hycbox-web/;
        index index.html;
        try_files $uri $uri/ @web_spa_ssl;
    }
    location @web_spa_ssl {
        rewrite ^ /web/index.html last;
    }

    location /web-trial/ {
        alias /opt/hycbox-web-trial/;
        index index.html;
        try_files $uri $uri/ @web_trial_spa_ssl;
    }
    location @web_trial_spa_ssl {
        rewrite ^ /web-trial/index.html last;
    }

    # 纠正误写 /web/-trial → /web-trial
    location ~ ^/web/-trial(/.*)?$ {
        return 302 /web-trial$1;
    }

    location = / {
        return 302 /web/home;
    }

    location /uploads/ {
        alias /opt/hycbox/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        autoindex off;
    }

    location /git/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}

# trial 子域：证书尚未包含该域名，统一跳到主域名体验站
server {
    listen 80;
    server_name trial.hychyr.top;
    return 302 https://hychyr.top/web-trial$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trial.hychyr.top;
    ssl_certificate     /etc/nginx/ssl/hychyr.top/hychyr.top.pem;
    ssl_certificate_key /etc/nginx/ssl/hychyr.top/hychyr.top.key;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    return 302 https://hychyr.top/web-trial$request_uri;
}
