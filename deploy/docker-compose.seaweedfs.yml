# SeaweedFS 单机（master + volume + filer）
# 启动：docker compose -f deploy/docker-compose.seaweedfs.yml up -d
# Filer 默认 8888；nginx 将 /uploads/ 反代到此服务
services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.79
    container_name: hycbox-seaweedfs
    command: "server -dir=/data -filer -filer.port=8888"
    ports:
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped

volumes:
  seaweedfs-data:
