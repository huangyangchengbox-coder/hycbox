# 本地调试：mvn spring-boot:run -Dspring-boot.run.profiles=local
# 敏感项仅用于本机，勿提交真实生产密钥
server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hycbox?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "******"
  jpa:
    show-sql: true

hycbox:
  storage-type: local
  public-base-url: http://127.0.0.1:8090/api
  upload-public-url: http://127.0.0.1:8090/api/uploads
  seaweedfs:
    filer-url: http://127.0.0.1:8888
    path-prefix: /uploads
  admin-password: "******"
  wx-app-id: ${HYCBOX_WX_APP_ID:}
  wx-app-secret: ${HYCBOX_WX_APP_SECRET:}
  wx-subscribe-template-id: ${HYCBOX_WX_SUBSCRIBE_TEMPLATE_ID:}
  # 需要重建演示数据时改为 true（仅 local profile 生效）
  reset-demo-data: false

logging:
  level:
    com.hycbox: debug
